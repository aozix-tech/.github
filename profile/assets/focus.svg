<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="244" viewBox="0 0 1200 244" role="img" aria-labelledby="title desc">
<title id="title">What we build</title><desc id="desc">Software with purpose. Intelligence, applied. A little more delight.</desc>
<defs>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#efe4ff"/><stop offset=".46" stop-color="#bea2ff"/><stop offset="1" stop-color="#88acff"/></linearGradient>
<linearGradient id="wire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bb99ff"/><stop offset=".55" stop-color="#bca4f2"/><stop offset="1" stop-color="#77a6ff"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#5a3585" stop-opacity=".34"/><stop offset=".6" stop-color="#37224f" stop-opacity=".15"/><stop offset="1" stop-color="#07080c" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15121f"/><stop offset="1" stop-color="#0b0c12"/></linearGradient>
</defs>
<g font-family="Helvetica Neue, Arial, sans-serif">
<g transform="translate(0 0)"><rect x=".5" y=".5" width="383" height="243" rx="18" fill="url(#panel)" stroke="#302638"/><path d="M27 1H357" stroke="url(#accent)" opacity=".45"/><text x="29" y="42" fill="#b8a4d9" font-size="12" font-weight="400" letter-spacing="2">01 / BUILD</text><g transform="translate(291 17)" fill="none" stroke="#baa5ec" stroke-width="1.6"><path d="M0 20 24 7 48 20 24 34ZM0 30l24 14 24-14M0 40l24 14 24-14"/></g><text x="29" y="116" fill="#ece6f5" font-size="27" font-weight="500" letter-spacing="-.7">Software with purpose.</text><text x="29" y="161" fill="#a9a3b8" font-size="19" font-weight="400" >Web platforms and mobile apps,</text><text x="29" y="191" fill="#a9a3b8" font-size="19" font-weight="400" >shaped around real needs.</text></g><g transform="translate(408 0)"><rect x=".5" y=".5" width="383" height="243" rx="18" fill="url(#panel)" stroke="#302638"/><path d="M27 1H357" stroke="url(#accent)" opacity=".45"/><text x="29" y="42" fill="#b8a4d9" font-size="12" font-weight="400" letter-spacing="2">02 / EXPLORE</text><g transform="translate(291 17)" fill="none" stroke="#baa5ec" stroke-width="1.6"><path d="M7 8 26 29 47 8M7 50l19-21 21 21"/><circle cx="26" cy="29" r="10" fill="#211831"/><circle cx="7" cy="8" r="4"/><circle cx="47" cy="8" r="4"/><circle cx="7" cy="50" r="4"/><circle cx="47" cy="50" r="4"/></g><text x="29" y="116" fill="#ece6f5" font-size="27" font-weight="500" letter-spacing="-.7">Intelligence, applied.</text><text x="29" y="161" fill="#a9a3b8" font-size="19" font-weight="400" >Practical AI tools and automation</text><text x="29" y="191" fill="#a9a3b8" font-size="19" font-weight="400" >for more meaningful work.</text></g><g transform="translate(816 0)"><rect x=".5" y=".5" width="383" height="243" rx="18" fill="url(#panel)" stroke="#302638"/><path d="M27 1H357" stroke="url(#accent)" opacity=".45"/><text x="29" y="42" fill="#b8a4d9" font-size="12" font-weight="400" letter-spacing="2">03 / PLAY</text><g transform="translate(291 17)" fill="none" stroke="#baa5ec" stroke-width="1.6"><rect x="0" y="10" width="53" height="38" rx="11"/><path d="M9 29h16m-8-8v16"/><circle cx="37" cy="25" r="2" fill="#9dc7ef"/><circle cx="43" cy="34" r="2" fill="#9dc7ef"/></g><text x="29" y="116" fill="#ece6f5" font-size="27" font-weight="500" letter-spacing="-.7">A little more delight.</text><text x="29" y="161" fill="#a9a3b8" font-size="19" font-weight="400" >Approachable games and thoughtful</text><text x="29" y="191" fill="#a9a3b8" font-size="19" font-weight="400" >interactive experiences.</text></g>
</g></svg>
