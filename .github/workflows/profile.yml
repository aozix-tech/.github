name: Publish organization profile

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-profile.py'
      - 'scripts/check-profile.py'
      - '.github/workflows/profile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-organization-profile
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Generate static brand assets and validate profile
        run: |
          python3 scripts/build-profile.py
          python3 scripts/check-profile.py
      - name: Commit generated profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/README.md profile/assets/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'docs: publish Aozix organization homepage and static brand assets'
            git push origin HEAD:main
          fi
          echo 'Organization profile: https://github.com/aozix-tech' >> "$GITHUB_STEP_SUMMARY"
